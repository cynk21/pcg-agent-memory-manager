name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Run production build
        run: npm run build

      - name: Run secret scan
        run: npm run secrets
